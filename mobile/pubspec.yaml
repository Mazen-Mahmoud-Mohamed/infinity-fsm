name: mobile
description: INFINITY — Total-Com Solutions Field Service Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  battery_plus: ^6.2.1
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  get_it: ^8.0.3
  go_router: ^15.1.2
  image: ^4.5.4
  image_picker: ^1.1.2
  internet_connection_checker_plus: ^2.7.2
  intl: ^0.20.2
  latlong2: ^0.10.1
  logger: ^2.5.0
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/infinity-icon.png
    - assets/infinity-logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/infinity-icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/infinity-icon.png
  adaptive_icon_foreground_inset: 22
  background_color_ios: "#FFFFFF"
  remove_alpha_ios: true
