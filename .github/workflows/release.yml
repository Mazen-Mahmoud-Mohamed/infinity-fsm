name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version from tag and pubspec
        id: version
        run: |
          node scripts/release/resolve-release-version.mjs --tag "${GITHUB_REF_NAME}" > release-version.json
          VERSION=$(node -p "require('./release-version.json').version")
          BUILD=$(node -p "require('./release-version.json').build")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android release APK
        working-directory: mobile
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
        run: >
          flutter build apk --release
          --build-name=${{ needs.resolve-version.outputs.version }}
          --build-number=${{ needs.resolve-version.outputs.build }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: resolve-version
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows release
        working-directory: mobile
        run: >
          flutter build windows --release
          --build-name=${{ needs.resolve-version.outputs.version }}
          --build-number=${{ needs.resolve-version.outputs.build }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/releases | Out-Null
          $version = "${{ needs.resolve-version.outputs.version }}"
          $outputBase = "INFINITY-Setup-$version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "installer.iss" `
            "/DRepoRoot=." `
            "/DMyAppVersion=$version" `
            "/DOutputBaseFilename=$outputBase" `
            "/DOutputDir=dist\releases"
          if (-not (Test-Path "dist/releases/$outputBase.exe")) {
            throw "Installer was not generated"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/releases/INFINITY-Setup-${{ needs.resolve-version.outputs.version }}.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - resolve-version
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/releases

      - name: Generate release manifest
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          BUILD="${{ needs.resolve-version.outputs.build }}"
          node scripts/release/generate-release-manifest.mjs \
            --version "$VERSION" \
            --build "$BUILD" \
            --channel stable \
            --notes "INFINITY FSM v${VERSION} automated release. Build: ${BUILD}." \
            --android mobile/build/app/outputs/flutter-apk/app-release.apk \
            --windows "dist/releases/INFINITY-Setup-$VERSION.exe" \
            --output dist/releases/release-manifest.json

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: INFINITY FSM v${{ needs.resolve-version.outputs.version }}
          body: |
            INFINITY FSM v${{ needs.resolve-version.outputs.version }}

            Build: ${{ needs.resolve-version.outputs.build }}
            Release channel: stable

            Automated release assets:
            - Android APK (`app-release.apk`)
            - Windows installer (`INFINITY-Setup-${{ needs.resolve-version.outputs.version }}.exe`)
            - Release manifest (`release-manifest.json`)
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            dist/releases/INFINITY-Setup-${{ needs.resolve-version.outputs.version }}.exe
            dist/releases/release-manifest.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
