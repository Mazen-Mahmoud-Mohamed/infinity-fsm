name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild (example: v1.0.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  EXPECTED_ANDROID_CERT_SHA256: f4fa51efb27eed8b3c3c95529130b2ce76fa006f23a9ee59e49f07dc3a3a21c7

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.release_tag }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

      - name: Resolve release version from tag and pubspec
        id: version
        run: |
          node scripts/release/resolve-release-version.mjs --tag "${{ env.RELEASE_TAG }}" > release-version.json
          VERSION=$(node -p "require('./release-version.json').version")
          BUILD=$(node -p "require('./release-version.json').build")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Validate Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            missing=1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD secret"
            missing=1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "Missing ANDROID_KEY_ALIAS secret"
            missing=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "Missing ANDROID_KEY_PASSWORD secret"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate Firebase Android client secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret"
            echo "Add the base64-encoded contents of mobile/android/app/google-services.json"
            exit 1
          fi

      - name: Prepare Android release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/android-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Prepare Firebase Android client config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          GS_PATH="mobile/android/app/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GS_PATH"
          chmod 600 "$GS_PATH"
          if [ ! -s "$GS_PATH" ]; then
            echo "Decoded google-services.json is empty"
            exit 1
          fi
          # Validate package match without printing secret field values.
          node -e "
            const fs = require('fs');
            let parsed;
            try {
              parsed = JSON.parse(fs.readFileSync('mobile/android/app/google-services.json', 'utf8'));
            } catch (error) {
              console.error('GOOGLE_SERVICES_JSON_INVALID');
              process.exit(1);
            }
            const ok = (parsed.client || []).some(
              (c) =>
                c?.client_info?.android_client_info?.package_name ===
                'com.example.mobile'
            );
            if (!ok) {
              console.error('GOOGLE_SERVICES_PACKAGE_MISMATCH');
              process.exit(1);
            }
            console.log('google_services_ready=true');
          "
          node mobile/tool/sync_firebase_options.js
          node mobile/tool/verify_firebase_options.js --require-configured

      - name: Build Android release APK
        working-directory: mobile
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --build-name=${{ needs.resolve-version.outputs.version }}
          --build-number=${{ needs.resolve-version.outputs.build }}

      - name: Verify APK release certificate
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Release APK was not generated"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found under $SDK_ROOT/build-tools"
            exit 1
          fi

          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -n 1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//I' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$CERT_SHA256" ]; then
            echo "Unable to read APK certificate SHA-256"
            exit 1
          fi

          echo "Verified APK certificate SHA-256: $CERT_SHA256"
          if [ "$CERT_SHA256" != "${{ env.EXPECTED_ANDROID_CERT_SHA256 }}" ]; then
            echo "APK certificate SHA-256 does not match the expected v1.0.2 signing certificate"
            exit 1
          fi

      - name: Remove release keystore
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi

      - name: Remove Firebase Android client config
        if: always()
        run: |
          rm -f mobile/android/app/google-services.json
          # Restore tracked placeholder template (do not leave generated secrets on the runner workspace).
          git checkout -- mobile/lib/core/push/firebase_options.dart

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: resolve-version
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows release
        working-directory: mobile
        run: >
          flutter build windows --release
          --build-name=${{ needs.resolve-version.outputs.version }}
          --build-number=${{ needs.resolve-version.outputs.build }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/releases | Out-Null
          $version = "${{ needs.resolve-version.outputs.version }}"
          $outputBase = "INFINITY-Setup-$version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "installer.iss" `
            "/DRepoRoot=." `
            "/DMyAppVersion=$version" `
            "/DOutputBaseFilename=$outputBase" `
            "/DOutputDir=dist\releases"
          if (-not (Test-Path "dist/releases/$outputBase.exe")) {
            throw "Installer was not generated"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/releases/INFINITY-Setup-${{ needs.resolve-version.outputs.version }}.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - resolve-version
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/releases

      - name: Generate release manifest
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          BUILD="${{ needs.resolve-version.outputs.build }}"
          node scripts/release/generate-release-manifest.mjs \
            --version "$VERSION" \
            --build "$BUILD" \
            --channel stable \
            --notes "INFINITY FSM v${VERSION} automated release. Build: ${BUILD}." \
            --android mobile/build/app/outputs/flutter-apk/app-release.apk \
            --windows "dist/releases/INFINITY-Setup-$VERSION.exe" \
            --output dist/releases/release-manifest.json

      - name: Remove stale release assets before re-upload
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet"
            exit 1
          fi

          ASSETS=(
            "app-release.apk"
            "INFINITY-Setup-${VERSION}.exe"
            "release-manifest.json"
          )

          for asset_name in "${ASSETS[@]}"; do
            if gh release view "$TAG" --json assets -q ".assets[] | select(.name==\"${asset_name}\") | .name" | grep -Fxq "$asset_name"; then
              gh release delete-asset "$TAG" "$asset_name" --yes
              echo "Deleted existing asset: $asset_name"
            else
              echo "Asset not present on release $TAG: $asset_name (skipping)"
            fi
          done

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: INFINITY FSM v${{ needs.resolve-version.outputs.version }}
          body: |
            INFINITY FSM v${{ needs.resolve-version.outputs.version }}

            Build: ${{ needs.resolve-version.outputs.build }}
            Release channel: stable

            Automated release assets:
            - Android APK (`app-release.apk`)
            - Windows installer (`INFINITY-Setup-${{ needs.resolve-version.outputs.version }}.exe`)
            - Release manifest (`release-manifest.json`)
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            dist/releases/INFINITY-Setup-${{ needs.resolve-version.outputs.version }}.exe
            dist/releases/release-manifest.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
