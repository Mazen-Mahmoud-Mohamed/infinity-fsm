name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version from tag and pubspec
        id: version
        shell: bash
        run: |
          node scripts/release/resolve-release-version.mjs --tag "${GITHUB_REF_NAME}" > release-version.json
          VERSION=$(node -p "require('./release-version.json').version")
          BUILD=$(node -p "require('./release-version.json').build")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android release APK
        working-directory: mobile
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.build }}

      - name: Build Windows release
        working-directory: mobile
        run: >
          flutter build windows --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.build }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/releases | Out-Null
          $version = "${{ steps.version.outputs.version }}"
          $outputBase = "INFINITY-Setup-$version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "installer.iss" `
            "/DRepoRoot=." `
            "/DMyAppVersion=$version" `
            "/DOutputBaseFilename=$outputBase" `
            "/DOutputDir=dist\releases"
          if (-not (Test-Path "dist/releases/$outputBase.exe")) {
            throw "Installer was not generated"
          }

      - name: Generate release manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          node scripts/release/generate-release-manifest.mjs \
            --version "$VERSION" \
            --build "$BUILD" \
            --channel stable \
            --notes "INFINITY FSM v${VERSION} automated release. Build: ${BUILD}." \
            --android mobile/build/app/outputs/flutter-apk/app-release.apk \
            --windows "dist/releases/INFINITY-Setup-$VERSION.exe" \
            --output dist/releases/release-manifest.json

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: INFINITY FSM v${{ steps.version.outputs.version }}
          body: |
            INFINITY FSM v${{ steps.version.outputs.version }}

            Build: ${{ steps.version.outputs.build }}
            Release channel: stable

            Automated release assets:
            - Android APK (`app-release.apk`)
            - Windows installer (`INFINITY-Setup-${{ steps.version.outputs.version }}.exe`)
            - Release manifest (`release-manifest.json`)
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            dist/releases/INFINITY-Setup-${{ steps.version.outputs.version }}.exe
            dist/releases/release-manifest.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
